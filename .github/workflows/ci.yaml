name: Uber Fare CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  mlops-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Dependencies
        run: |
          uv pip install --system \
            pandas numpy scikit-learn \
            "dvc[s3]" dagshub mlflow python-dotenv \
            fastapi uvicorn jinja2 prometheus-client httpx python-multipart

      - name: Configure DVC Remote (DagsHub S3)
        env:
          CAPSTONE_TEST: ${{ secrets.CAPSTONE_TEST }}
        run: |
          # Override the local default remote with the DagsHub cloud remote
          dvc remote add -d dagshub_remote s3://dvc --force
          dvc remote modify dagshub_remote endpointurl https://dagshub.com/RedLordezh7Venom/uberfareMLOPs.s3
          dvc remote modify dagshub_remote access_key_id $CAPSTONE_TEST
          dvc remote modify dagshub_remote secret_access_key $CAPSTONE_TEST

      - name: Pull Raw Data
        env:
          CAPSTONE_TEST: ${{ secrets.CAPSTONE_TEST }}
        run: |
          dvc pull data/raw/uber.csv.dvc

      - name: Run DVC Pipeline
        env:
          CAPSTONE_TEST: ${{ secrets.CAPSTONE_TEST }}
        run: |
          dvc repro

      - name: Run Model Tests
        env:
          CAPSTONE_TEST: ${{ secrets.CAPSTONE_TEST }}
        run: |
          python -m unittest tests/test_model.py

      - name: Promote Model to Production
        if: github.ref == 'refs/heads/main' && success()
        env:
          CAPSTONE_TEST: ${{ secrets.CAPSTONE_TEST }}
        run: |
          python scripts/promote_model.py

      - name: Run FastAPI App Tests
        if: success()
        env:
          CAPSTONE_TEST: ${{ secrets.CAPSTONE_TEST }}
        run: |
          python -m unittest tests/test_app.py

      # ---------------------------------------------------------------
      # CD: Build Docker image and push to AWS ECR
      # Requires these GitHub Secrets to be configured:
      #   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION,
      #   AWS_ACCOUNT_ID, ECR_REPOSITORY
      # ---------------------------------------------------------------
      - name: Configure AWS Credentials
        if: github.ref == 'refs/heads/main' && success()
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.ref == 'refs/heads/main' && success()
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, Tag and Push Docker Image to ECR
        if: github.ref == 'refs/heads/main' && success()
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "Image pushed: $ECR_REGISTRY/$ECR_REPOSITORY:latest"

      # ---------------------------------------------------------------
      # CD: Deploy to EKS
      # Additional secrets required: EKS_CLUSTER_NAME
      # ---------------------------------------------------------------
      - name: Deploy to EKS
        if: github.ref == 'refs/heads/main' && success()
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
          CAPSTONE_TEST: ${{ secrets.CAPSTONE_TEST }}
        run: |
          # Connect kubectl to EKS cluster
          aws eks update-kubeconfig --name $EKS_CLUSTER_NAME --region ${{ secrets.AWS_REGION }}

          # Update deployment.yaml to use the freshly-pushed ECR image
          sed -i "s|image:.*|image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG|" deployment.yaml

          # Inject the DagsHub token into the deployment manifest
          sed -i "s|value: \".*\"  # CAPSTONE_TEST|value: \"$CAPSTONE_TEST\"  # CAPSTONE_TEST|" deployment.yaml

          # Apply to EKS
          kubectl apply -f deployment.yaml

          # Wait for rollout to complete
          kubectl rollout status deployment/uber-fare-app --timeout=120s

          # Print service info (get external LoadBalancer IP)
          kubectl get svc uber-fare-service
